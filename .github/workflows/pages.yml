name: Testa och publicera Algebralabbet
on:
  push:
    branches: [main]
    paths: ['dist/**', 'scripts/**', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Ensure FFprobe is available
        run: command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Verify mathematics
        run: node --test scripts/model.test.mjs
      - name: Check browser module
        run: node --check dist/app.js
      - name: Verify all resources and six full HD films
        run: python scripts/verify_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish pupil website
        id: deployment
        uses: actions/deploy-pages@v5
